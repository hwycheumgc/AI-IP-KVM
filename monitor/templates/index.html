<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monitor Control</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #1c2028;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --dim: #8b93a1;
    --good: #4caf7d;
    --warn: #e0a83e;
    --bad: #d9534f;
    --accent: #4c8bf5;
    --mono: "SF Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 32px 20px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 24px; }

  .control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 20px;
  }
  .status-line { display: flex; align-items: center; gap: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
  .dot.on { background: var(--good); box-shadow: 0 0 8px var(--good); }
  .status-text { font-size: 14px; }
  .status-text .mode { color: var(--dim); font-size: 12px; }

  button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    border: none;
    border-radius: 7px;
    padding: 9px 16px;
    cursor: pointer;
  }
  #toggleBtn { background: var(--accent); color: white; }
  #toggleBtn.stop { background: #3a3f4a; color: var(--text); }

  .mode-select {
    display: none;
    gap: 8px;
    margin-bottom: 20px;
  }
  .mode-select.visible { display: flex; }
  .mode-btn {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--dim);
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
  }
  .mode-btn.active { border-color: var(--accent); color: var(--text); }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab {
    background: none; border: none; color: var(--dim);
    padding: 10px 4px; margin-right: 20px; font-size: 14px;
    border-bottom: 2px solid transparent; cursor: pointer;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  .panel { display: none; }
  .panel.active { display: block; }

  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .metric {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
  }
  .metric-label { color: var(--dim); font-size: 12px; margin-bottom: 6px; }
  .metric-value { font-family: var(--mono); font-size: 22px; }

  .anomaly-item {
    background: var(--panel); border: 1px solid var(--border);
    border-left: 3px solid var(--warn);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 10px;
  }
  .anomaly-item.high { border-left-color: var(--bad); }
  .anomaly-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .anomaly-metric { font-family: var(--mono); }
  .anomaly-time { color: var(--dim); }
  .anomaly-explain { font-size: 13px; color: var(--dim); }
  .empty-state { color: var(--dim); font-size: 13px; padding: 20px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Monitor Control</h1>
  <div class="sub">Watches this machine's health and flags anything unusual.</div>

  <div class="control-row">
    <div class="status-line">
      <div class="dot" id="statusDot"></div>
      <div class="status-text">
        <div id="statusLabel">Stopped</div>
        <div class="mode" id="modeLabel"></div>
      </div>
    </div>
    <button id="toggleBtn">Start</button>
  </div>

  <div class="mode-select" id="modeSelect">
    <button class="mode-btn" data-mode="learning" id="learningBtn">Learning</button>
    <button class="mode-btn" data-mode="watching" id="watchingBtn">Watching</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-panel="status">Status</button>
    <button class="tab" data-panel="log">Anomaly Log</button>
  </div>

  <div class="panel active" id="statusPanel">
    <div class="metric-grid" id="metricGrid">
      <div class="metric"><div class="metric-label">CPU</div><div class="metric-value">--</div></div>
      <div class="metric"><div class="metric-label">Memory</div><div class="metric-value">--</div></div>
      <div class="metric"><div class="metric-label">Disk</div><div class="metric-value">--</div></div>
      <div class="metric"><div class="metric-label">Temperature</div><div class="metric-value">--</div></div>
    </div>
  </div>

  <div class="panel" id="logPanel">
    <div id="anomalyList" class="empty-state">No anomalies found yet.</div>
  </div>
</div>

<script>
let currentMode = "stopped";

async function refreshStatus() {
  const res = await fetch("/api/status");
  const data = await res.json();
  currentMode = data.mode;

  const dot = document.getElementById("statusDot");
  const label = document.getElementById("statusLabel");
  const modeLabel = document.getElementById("modeLabel");
  const toggleBtn = document.getElementById("toggleBtn");
  const modeSelect = document.getElementById("modeSelect");

  const running = data.mode === "learning" || data.mode === "watching";
  dot.classList.toggle("on", running);
  label.textContent = running ? "Running" : "Stopped";
  modeLabel.textContent = running ? (data.mode === "learning" ? "Learning what's normal" : "Watching for problems") : "";
  toggleBtn.textContent = running ? "Stop" : "Start";
  toggleBtn.classList.toggle("stop", running);
  modeSelect.classList.toggle("visible", running);

  document.getElementById("learningBtn").classList.toggle("active", data.mode === "learning");
  document.getElementById("watchingBtn").classList.toggle("active", data.mode === "watching");

  if (data.latest_reading) {
    const r = data.latest_reading;
    const grid = document.getElementById("metricGrid");
    const cards = grid.querySelectorAll(".metric-value");
    cards[0].textContent = r.cpu_percent.toFixed(1) + "%";
    cards[1].textContent = r.memory_percent.toFixed(1) + "%";
    cards[2].textContent = r.disk_percent.toFixed(1) + "%";
    cards[3].textContent = r.temperature_c !== null ? r.temperature_c.toFixed(1) + "\u00b0C" : "not available";
  }
}

async function refreshAnomalies() {
  const res = await fetch("/api/anomalies");
  const items = await res.json();
  const container = document.getElementById("anomalyList");

  if (items.length === 0) {
    container.className = "empty-state";
    container.textContent = "No anomalies found yet.";
    return;
  }

  container.className = "";
  container.innerHTML = items.map(a => {
    const time = new Date(a.timestamp * 1000).toLocaleString();
    const explain = a.explanation ? `<div class="anomaly-explain">${a.explanation}</div>` : "";
    return `<div class="anomaly-item ${a.severity}">
      <div class="anomaly-top">
        <span class="anomaly-metric">${a.metric}: ${a.value.toFixed(1)}</span>
        <span class="anomaly-time">${time}</span>
      </div>
      ${explain}
    </div>`;
  }).join("");
}

document.getElementById("toggleBtn").addEventListener("click", async () => {
  const running = currentMode === "learning" || currentMode === "watching";
  if (running) {
    await fetch("/api/stop", { method: "POST" });
  } else {
    await fetch("/api/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: "learning" }),
    });
  }
  refreshStatus();
});

document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", async () => {
    await fetch("/api/set_mode", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: btn.dataset.mode }),
    });
    refreshStatus();
  });
});

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(tab.dataset.panel + "Panel").classList.add("active");
  });
});

refreshStatus();
refreshAnomalies();
setInterval(refreshStatus, 4000);
setInterval(refreshAnomalies, 8000);
</script>
</body>
</html>
